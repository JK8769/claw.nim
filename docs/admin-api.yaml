openapi: 3.1.0
info:
  title: claw orchestrator admin API
  description: |
    Admin surface for `claw daemon` (the multi-company orchestrator).
    The daemon discovers companies on disk + mounted volumes, spawns
    one `claw gateway` per company on demand, aggregates health, and
    exposes this contract via TWO transports that share the same
    dispatch logic:

      1. **stdio (JSON-RPC 2.0)** — invoked as `claw daemon --stdio`.
         The Zen-native integration path: Zen spawns the daemon as a
         child process and reads JSONL responses + events from stdout.
         Logs go to stderr; stdin carries commands. Single-client by
         construction (parent process). Works over SSH and inside
         terminals — no browser needed.

      2. **HTTP + (future) WebSocket** — invoked as `claw daemon`.
         The third-party dashboard path: web UIs, mobile apps, curl,
         remote management over loopback. Multi-client.

    **Method ↔ HTTP route mapping** (stdio method name → REST equivalent):

      | JSON-RPC method | HTTP route                          |
      |-----------------|-------------------------------------|
      | `healthz`       | GET  /healthz                       |
      | `list_companies`| GET  /companies                     |
      | `start`         | POST /companies/{name}/start        |
      | `stop`          | POST /companies/{name}/stop         |

    Each JSON-RPC `result` body is exactly the JSON returned by the
    corresponding HTTP endpoint. JSON-RPC errors carry the HTTP status
    code in `error.code` and the response body in `error.data` —
    so a third-party SDK can route both transports through one
    deserializer.

    **stdio protocol (JSON-RPC 2.0):**

      Request from client:
        ```jsonl
        {"jsonrpc":"2.0","id":1,"method":"list_companies"}
        {"jsonrpc":"2.0","id":2,"method":"start","params":{"name":"MyCo"}}
        {"jsonrpc":"2.0","id":3,"method":"stop","params":{"name":"MyCo","timeout_ms":10000}}
        ```

      Response from daemon:
        ```jsonl
        {"jsonrpc":"2.0","id":1,"result":{"companies":[...]}}
        {"jsonrpc":"2.0","id":2,"result":{"name":"MyCo","status":"starting",...}}
        {"jsonrpc":"2.0","id":3,"error":{"code":404,"message":"company not found","data":{...}}}
        ```

      One JSON object per line on either stream. The daemon flushes
      stdout after every response, so line-buffered parents see
      responses immediately. EOF on stdin → graceful shutdown
      (every owned child gateway gets SIGTERM with grace).

    **Process model:** single binary, multiple roles.
      - `claw daemon` / `claw daemon --stdio`   — host orchestrator
      - `claw gateway`  — per-company worker. One child process per
                          running company, addressed by NIMCLAW_DIR.
      - `claw <cmd>`    — one-shot CLI subcommands. May route through
                          the daemon for multi-company operations.

    **Auth:** stdio transport has no auth — parent process trust is
    inherited from the OS spawn. HTTP transport on loopback
    (`127.0.0.1:13140`, the default) trusts the local user. HTTP
    bound to non-loopback REQUIRES a bearer token
    (`~/.nimclawd/admin-token`) via `Authorization: Bearer <token>`.

    **Versioning:** this spec is `v1`. Breaking changes ship as `v2/`
    route prefix (and `method` prefix). Additive changes don't bump.

  version: 1.0.0
  contact:
    name: claw.nim
    url: https://github.com/JK8769/claw.nim
  license:
    name: MIT

servers:
  - url: http://127.0.0.1:13140
    description: Local-loopback default

security:
  - bearerAuth: []
  - {}     # also accept no auth when daemon is on loopback

paths:
  /healthz:
    get:
      summary: Daemon health probe
      description: |
        Cheap heartbeat. Returns 200 with version + uptime if the daemon
        is alive. No auth required.
      security: []
      responses:
        "200":
          description: Daemon is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /companies:
    get:
      summary: List all discovered companies
      description: |
        Walks `~/.nimclaw-*` plus every mounted volume's `/Volumes/*/.nimclaw-*`
        (Linux: `/media/*/.nimclaw-*`, `/mnt/*/.nimclaw-*`) and returns one
        entry per discovered company, each with running status and basic
        metadata. Cheap — uses each company's `.manifest.json` (if present)
        or a shallow read of BASE.json otherwise.
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  companies:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanySummary"

  /companies/{name}:
    parameters:
      - $ref: "#/components/parameters/CompanyName"
    get:
      summary: Detailed company status
      description: |
        Full state for one company. Heavier than the list endpoint — reads
        BASE.json, queries the child gateway's `/healthz` if running, and
        aggregates volume metrics.
      responses:
        "200":
          description: Company detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /companies/{name}/start:
    parameters:
      - $ref: "#/components/parameters/CompanyName"
    post:
      summary: Start the gateway for this company
      description: |
        Spawns `claw gateway` as a child process with `NIMCLAW_DIR=<co_path>`
        and other env inherited. Idempotent — returns 200 with `already_running=true`
        if a gateway is already running for this company (verified by
        reading `<co>/logs/gateway.pid` + a `kill -0` liveness check).

        The daemon does NOT wait for the gateway to fully boot. It returns
        immediately with the spawn outcome. Use the WebSocket event stream
        (`GET /events`) or poll `GET /companies/{name}` to observe the
        boot progress and final state.
      responses:
        "200":
          description: Spawn requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Pre-flight failed (e.g. volume unmounted, BASE.json missing).
            Body explains the reason; agent retries after fixing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /companies/{name}/stop:
    parameters:
      - $ref: "#/components/parameters/CompanyName"
    post:
      summary: Stop the gateway for this company
      description: |
        Sends SIGTERM to the child gateway (PID read from
        `<co>/logs/gateway.pid`). Waits up to `timeout_ms` (default 10s)
        for clean exit, then escalates to SIGKILL.

        Channel adapters (Feishu/Telegram/NKN/Mobile) get a chance to
        flush their state during the SIGTERM grace period — clean stops
        leave the company in a re-startable state with no lost messages.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                timeout_ms:
                  type: integer
                  minimum: 1000
                  maximum: 60000
                  default: 10000
                  description: Grace period before SIGKILL escalation
      responses:
        "200":
          description: Gateway stopped (or was not running)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StopResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /companies/{name}/restart:
    parameters:
      - $ref: "#/components/parameters/CompanyName"
    post:
      summary: Restart the gateway (stop + start, atomically)
      description: |
        Convenience for skill / config changes. Equivalent to `stop`
        then `start`. Reports total elapsed time so dashboards can show
        "restarting…" progress for ~5–15s windows.
      responses:
        "200":
          description: Restart completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestartResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /companies/{name}/logs:
    parameters:
      - $ref: "#/components/parameters/CompanyName"
      - name: tail
        in: query
        schema: { type: integer, minimum: 1, maximum: 10000, default: 200 }
      - name: follow
        in: query
        schema: { type: boolean, default: false }
        description: |
          When true, returns a streaming response (text/event-stream) that
          appends new log lines as they arrive. Stream stays open until
          the client disconnects.
    get:
      summary: Tail recent gateway logs
      description: |
        Reads `<co>/logs/gateway.log` from the tail. Stream mode emits
        each new line as an SSE `data:` event for dashboard log panes.
      responses:
        "200":
          description: |
            JSON array of log lines (when `follow=false`), or `text/event-stream`
            (when `follow=true`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  lines:
                    type: array
                    items: { type: string }
            text/event-stream:
              schema: { type: string }

  /companies/{name}/eject:
    parameters:
      - $ref: "#/components/parameters/CompanyName"
    post:
      summary: Graceful shutdown + signal "safe to unmount"
      description: |
        Like `stop`, but waits for the channel adapters to flush, the
        session log to commit its pending writes, and the volume's IO
        queue to drain. Specifically intended for USB-mounted companies
        where the operator wants to physically remove the drive after.
      responses:
        "200":
          description: |
            Company stopped and volume is safe to unmount. The response
            includes a `safe_to_eject=true` flag dashboards can render
            as a clear visual cue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EjectResponse"

  /events:
    get:
      summary: Real-time event stream (WebSocket)
      description: |
        Upgrade-only endpoint. Returns 426 on plain GET. Clients connect
        with `Upgrade: websocket` and receive JSON-line events:

          • `company_added`         — new company discovered (volume mount)
          • `company_removed`       — company gone (volume eject)
          • `gateway_started`       — `start` succeeded, gateway is up
          • `gateway_stopped`       — `stop` succeeded
          • `gateway_crashed`       — child process exited with non-zero
                                      code unexpectedly
          • `volume_health_changed` — green/yellow/red dot transition
          • `cost_update`           — daily token usage rollup
          • `daemon_shutting_down`  — daemon received SIGTERM

        Each event is one JSON object per WebSocket message — line-oriented
        JSONL would also work but WebSocket framing is the standard.
      responses:
        "101": { description: WebSocket upgrade successful }
        "426": { description: This endpoint requires WebSocket upgrade }

components:
  parameters:
    CompanyName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9_-]+$
        description: |
          Company short name (e.g. `MyCompany`, `SunGrowCN`). Resolves to
          one of the discovered company dirs — case-sensitive match against
          BASE.json's org.name, or against the dir suffix after `.nimclaw-`.

  responses:
    NotFound:
      description: Company not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-token

  schemas:
    HealthResponse:
      type: object
      required: [status, version, uptime_seconds]
      properties:
        status:    { type: string, enum: [ok] }
        version:   { type: string, description: claw binary version }
        uptime_seconds: { type: number }
        companies_running: { type: integer }
        companies_total: { type: integer }

    CompanySummary:
      type: object
      required: [name, path, status]
      properties:
        name:    { type: string }
        path:    { type: string, description: Absolute path to .nimclaw-<n> }
        status:  { $ref: "#/components/schemas/CompanyStatus" }
        agents_count:   { type: integer }
        channels:       { type: array, items: { type: string } }
        last_run_at:    { type: string, format: date-time, nullable: true }
        volume:
          $ref: "#/components/schemas/VolumeInfo"

    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/CompanySummary"
        - type: object
          properties:
            providers:      { type: array, items: { type: string } }
            agents:
              type: array
              items:
                type: object
                properties:
                  name:    { type: string }
                  model:   { type: string }
                  role:    { type: string }
            socket_path:    { type: string, nullable: true }
            llm_port:       { type: integer, nullable: true }
            pid:            { type: integer, nullable: true }
            started_at:     { type: string, format: date-time, nullable: true }
            tokens_today:   { type: integer }
            tokens_total:   { type: integer }

    CompanyStatus:
      type: string
      enum:
        - stopped     # gateway not running
        - starting    # spawn requested, not yet healthy
        - running     # healthy
        - stopping    # SIGTERM sent, awaiting exit
        - crashed     # child exited non-zero unexpectedly
        - unavailable # volume not mounted

    VolumeInfo:
      type: object
      properties:
        mounted:        { type: boolean }
        mount_point:    { type: string }
        bus:            { type: string, enum: [internal, usb, network, unknown] }
        link_rate_mbps: { type: number, nullable: true,
                          description: USB negotiated link speed (5000 = USB 3.0, etc.) }
        io_latency_ms:  { type: number, nullable: true,
                          description: Rolling write+read probe latency }
        free_gb:        { type: number }
        total_gb:       { type: number }
        health:         { type: string, enum: [green, yellow, red] }

    StartResponse:
      type: object
      required: [name, status]
      properties:
        name:    { type: string }
        status:  { $ref: "#/components/schemas/CompanyStatus" }
        pid:     { type: integer, nullable: true }
        already_running: { type: boolean }
        started_at: { type: string, format: date-time, nullable: true }

    StopResponse:
      type: object
      required: [name, status]
      properties:
        name:    { type: string }
        status:  { $ref: "#/components/schemas/CompanyStatus" }
        was_running: { type: boolean }
        exit_code: { type: integer, nullable: true }
        graceful: { type: boolean, description: True if SIGTERM sufficed (no SIGKILL needed) }

    RestartResponse:
      allOf:
        - $ref: "#/components/schemas/StartResponse"
        - type: object
          properties:
            elapsed_ms: { type: integer }

    EjectResponse:
      allOf:
        - $ref: "#/components/schemas/StopResponse"
        - type: object
          properties:
            safe_to_eject: { type: boolean }
            volume_path: { type: string, nullable: true }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:   { type: string, description: Human-readable reason }
        code:    { type: string, description: Stable machine-readable code }
        detail:  { type: object, additionalProperties: true, nullable: true }
